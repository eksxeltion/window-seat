# Risk labeler
#
# Runs on pull_request_target, so the workflow definition always comes from the
# trusted base / default branch, not from the pull request. It never checks
# out, downloads, or runs pull request code. It only reads PR metadata and
# diffs through the GitHub API and applies the risk:red label when sensitive
# paths or content are touched.
#
# The matching rules live in .github/scripts/risk_match.js so that
# tests/test_risk_labeler.py exercises the same code. That file is checked out
# from github.sha, which on pull_request_target is the trusted base / default
# branch commit the workflow itself comes from, never the PR head.
#
# Stephane merges the PR that adds or changes this workflow himself.

name: Risk labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trusted ref only. Do not change this to the PR head ref or sha.
      # continue-on-error so a failed checkout still reaches the labeler step,
      # which sees CHECKOUT_OUTCOME != success and fails closed.
      - name: Check out matching rules from the trusted base ref
        id: trusted
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
          path: trusted-base

      - name: Apply risk:red when sensitive files or content change
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          CHECKOUT_OUTCOME: ${{ steps.trusted.outcome }}
        with:
          script: |
            const RED = 'risk:red';
            const HOLD = 'hold';
            const DOWNGRADE_LABELS = ['risk:green', 'risk:yellow'];
            const FILE_LIST_CAP = 3000;

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const pull_number = pr.number;

            // Local log sanitizer for errors, so the failure path does not depend
            // on the helper. Escapes untrusted text so it cannot inject workflow
            // commands via logs. Reasons from fileReason are already sanitized.
            const localSanitize = (text) =>
              String(text).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
            const describe = (e) => {
              try {
                return localSanitize((e && e.message) || e);
              } catch (_) {
                return 'unprintable error';
              }
            };

            // Fail closed: any error below (checkout failed, helper missing, API
            // error or 5xx, ...) adds risk:red, adds hold if that label exists,
            // then rethrows so the job fails. Nothing here ever removes risk:red
            // or hold.
            try {
              if (process.env.CHECKOUT_OUTCOME !== 'success') {
                throw new Error(`trusted checkout outcome is ${localSanitize(process.env.CHECKOUT_OUTCOME)}`);
              }
              const path = require('path');
              const helper = require(
                path.join(process.env.GITHUB_WORKSPACE, 'trusted-base', '.github', 'scripts', 'risk_match.js'),
              );
              const { fileReason } = helper;
              if (typeof fileReason !== 'function') {
                throw new Error('risk_match.js does not export fileReason');
              }

              // Decide whether the PR matches.
              let reason = null;

              // Prefer a fresh changed_files count from the API over the event
              // payload. An API error here goes to the fail-closed handler.
              let changedFiles =
                typeof pr.changed_files === 'number' ? pr.changed_files : null;
              const { data: freshPr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number,
              });
              if (typeof freshPr.changed_files === 'number') {
                changedFiles = freshPr.changed_files;
              }

              // Force red only when the PR is known to exceed the list-files cap.
              if (typeof changedFiles === 'number' && changedFiles > FILE_LIST_CAP) {
                reason = `changed_files is ${changedFiles} (cap ${FILE_LIST_CAP})`;
              }

              if (!reason) {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number,
                  per_page: 100,
                });

                // If the API returned the cap and we cannot confirm the true count
                // is exactly the cap, assume there may be more files and force red.
                if (
                  files.length >= FILE_LIST_CAP &&
                  (typeof changedFiles !== 'number' || changedFiles > FILE_LIST_CAP)
                ) {
                  reason = `file list returned ${files.length} files (cap ${FILE_LIST_CAP})`;
                }

                // Matching rules (keywords, credential identifiers, missing
                // patches, tests/ skip, path rules) live in risk_match.js.
                for (const f of files) {
                  if (reason) break;
                  reason = fileReason(f);
                }
              }

              if (!reason) {
                core.info('No sensitive paths or content found. Leaving labels unchanged.');
                return;
              }

              core.info(`Forcing ${RED}. Reason: ${reason}`);

              if (
                context.payload.action === 'unlabeled' &&
                context.payload.label &&
                context.payload.label.name === RED
              ) {
                core.info(`${RED} was removed but the PR still matches. Restoring it.`);
              }

              // Read current labels from the API, not only the event payload.
              const current = await github.paginate(github.rest.issues.listLabelsOnIssue, {
                owner,
                repo,
                issue_number: pull_number,
                per_page: 100,
              });
              const names = new Set(current.map((l) => l.name));

              if (!names.has(RED)) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pull_number,
                  labels: [RED],
                });
                core.info(`Added ${RED}.`);
              } else {
                core.info(`${RED} already present.`);
              }

              for (const name of DOWNGRADE_LABELS) {
                if (!names.has(name)) continue;
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pull_number,
                    name,
                  });
                  core.info(`Removed ${name}.`);
                } catch (err) {
                  if (err.status === 404) {
                    core.info(`${name} was already gone.`);
                  } else {
                    throw err;
                  }
                }
              }
            } catch (err) {
              core.error(`Risk labeler failed, failing closed: ${describe(err)}`);
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pull_number,
                  labels: [RED],
                });
                core.info(`Added ${RED} after the failure.`);
              } catch (redErr) {
                core.error(`Could not add ${RED}: ${describe(redErr)}`);
              }
              // addLabels would create a missing label, so only add hold if it
              // already exists on the repo.
              try {
                await github.rest.issues.getLabel({ owner, repo, name: HOLD });
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pull_number,
                  labels: [HOLD],
                });
                core.info(`Added ${HOLD} after the failure.`);
              } catch (holdErr) {
                core.warning(`Could not add ${HOLD}: ${describe(holdErr)}`);
              }
              throw err;
            }
