<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Window Seat Receiver</title>
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta http-equiv="Cache-Control" content="no-cache">
  <link rel="stylesheet" href="css/receiver.css?v=2026-11-17.15">
  <!-- The Cast receiver framework is injected by js/receiver.js (skipped with ?debug=1) so it can never block the page. -->
  <script type="module" src="js/receiver.js?v=2026-11-17.15"></script>
</head>
<body>
  <video id="keepalive" loop muted autoplay playsinline style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none"></video>
  <!-- Music sits under the cam layer at z-index 0, transparent, but still rendered so it keeps playing. -->
  <div id="music">
    <div id="music-frame"><div id="music-player"></div></div>
    <div id="music-title"></div>
  </div>
  <div id="cam"><div id="cam-player"></div></div>
  <div id="blackout" class="on"></div>

  <div id="cmd-toast" role="status"></div>
  <div id="paused-pill" role="status" hidden><span>Paused</span><span id="paused-closing"></span></div>
  <div id="safe">
    <div id="caption" class="quiet" aria-hidden="true">
      <div id="cap-title"></div>
      <div id="cap-meta"></div>
      <div id="cap-music"></div>
      <div id="cap-brand">Window Seat</div>
    </div>
  </div>
  <div id="debug-strip" role="status"></div>
</body>
</html>
